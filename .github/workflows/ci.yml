# CI — the merge gate. docs/ci.md says what it must do, and why.
#
# The gate is one command, `check` (AGENTS.md "Commands"), that you, agents,
# and CI all run. Plan 0001's Phase 0 wires it in below: toolchain setup,
# install, check. A Markdown-only diff skips all three, but the job still runs
# and reports green, so `gate` can be a required status check.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect docs-only change
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"; HEAD="$PR_HEAD"
          else
            BASE="$PUSH_BEFORE"; HEAD="$PUSH_AFTER"
          fi

          if [ -z "$BASE" ] || [ -z "$HEAD" ] \
            || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "No comparable base commit (new branch, force-push, or manual run) — running full checks."
            exit 0
          fi

          CHANGED="$(git diff --name-only "$BASE...$HEAD")"
          echo "Changed files:"
          echo "$CHANGED"

          if [ -z "$CHANGED" ] || printf '%s\n' "$CHANGED" | grep -qvE '\.md$'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Markdown-only diff — skipping setup and check (docs/ci.md)."
          fi

      # TEMPLATE: Phase 0 replaces the step below with the stack's gate, each
      # step guarded by `if: steps.changes.outputs.docs_only != 'true'`:
      #   1. toolchain setup, version pinned, with dependency caching
      #      (e.g. actions/setup-node with node-version-file and cache: npm)
      #   2. install from the lockfile (e.g. `npm ci`)
      #   3. the check command (e.g. `npm run check`)
      - name: Gate not wired yet
        if: steps.changes.outputs.docs_only != 'true'
        run: echo "::warning::The gate isn't wired yet — plan 0001 Phase 0 adds toolchain setup, install, and check (docs/ci.md)."

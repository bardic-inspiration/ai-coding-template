# CI — stack-agnostic merge gate.
#
# docs/ci-standards.md defines what this workflow must accomplish and why;
# this file implements that contract. A stack module fills in the commands and
# the toolchain setup step — it never changes the contract.
#
# How it activates:
#   - The gate commands live in the env block below and mirror AGENTS.md §5.
#     An empty command means that stage isn't wired up yet: it is skipped with
#     a notice, so CI is green on the process-only baseline and each stage
#     switches on the moment its command is filled in.
#   - Once the project has code to check, set GATE_REQUIRED to "true". From
#     then on an empty LINT_CMD or TEST_CMD fails the job instead of passing
#     vacuously.
#   - A Markdown-only diff skips install and the code gate (docs-only fast
#     path, docs/docs-only-changes.md). The job still runs and reports green,
#     so it can be a required status check.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # TEMPLATE: keep in sync with the command table in AGENTS.md §5.
  GATE_REQUIRED: "false"
  INSTALL_CMD: ""
  LINT_CMD: ""
  FORMAT_CHECK_CMD: ""
  TYPECHECK_CMD: ""
  TEST_CMD: ""
  BUILD_CMD: ""
  # Checks that run on every change, docs-only included (a link check, a
  # doc-matches-code check). They run before INSTALL_CMD, so they must not
  # depend on installed dependencies.
  DOCS_CHECK_CMD: ""

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # TEMPLATE: a stack module may add a runtime-version matrix here, e.g.
    #   strategy:
    #     fail-fast: false
    #     matrix:
    #       runtime-version: ["<previous LTS>", "<current LTS>"]
    # Remember a matrix renames the check ("gate (22)"), which matters for
    # branch protection's required status checks.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect docs-only change
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"; HEAD="$PR_HEAD"
          else
            BASE="$PUSH_BEFORE"; HEAD="$PUSH_AFTER"
          fi

          if [ -z "$BASE" ] || [ -z "$HEAD" ] \
            || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "No comparable base commit (new branch, force-push, or manual run) — running full checks."
            exit 0
          fi

          CHANGED="$(git diff --name-only "$BASE...$HEAD")"
          echo "Changed files:"
          echo "$CHANGED"

          if [ -z "$CHANGED" ] || printf '%s\n' "$CHANGED" | grep -qvE '\.md$'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Markdown-only diff — skipping install and the code gate (docs/docs-only-changes.md)."
          fi

      - name: Check gate configuration
        shell: bash
        run: |
          for stage in INSTALL LINT FORMAT_CHECK TYPECHECK TEST BUILD DOCS_CHECK; do
            var="${stage}_CMD"
            if [ -z "${!var}" ]; then
              echo "::notice::$var is not set — that stage is inactive (AGENTS.md §5, docs/ci-standards.md)."
            fi
          done

          if [ "$GATE_REQUIRED" = "true" ]; then
            for var in LINT_CMD TEST_CMD; do
              if [ -z "${!var}" ]; then
                echo "::error::GATE_REQUIRED is true but $var is empty — CI would pass vacuously. Fill it in (AGENTS.md §5)."
                exit 1
              fi
            done
          fi

      - name: Docs checks
        if: env.DOCS_CHECK_CMD != ''
        shell: bash
        run: eval "$DOCS_CHECK_CMD"

      # TEMPLATE: toolchain setup. A stack module inserts its setup step(s)
      # here — a language runtime, a dependency cache — guarded like the gate
      # stages below so docs-only changes stay fast:
      #   if: steps.changes.outputs.docs_only != 'true'

      - name: Install
        if: steps.changes.outputs.docs_only != 'true' && env.INSTALL_CMD != ''
        shell: bash
        run: eval "$INSTALL_CMD"

      - name: Lint
        if: steps.changes.outputs.docs_only != 'true' && env.LINT_CMD != ''
        shell: bash
        run: eval "$LINT_CMD"

      - name: Format check
        if: steps.changes.outputs.docs_only != 'true' && env.FORMAT_CHECK_CMD != ''
        shell: bash
        run: eval "$FORMAT_CHECK_CMD"

      - name: Typecheck
        if: steps.changes.outputs.docs_only != 'true' && env.TYPECHECK_CMD != ''
        shell: bash
        run: eval "$TYPECHECK_CMD"

      - name: Test
        if: steps.changes.outputs.docs_only != 'true' && env.TEST_CMD != ''
        shell: bash
        run: eval "$TEST_CMD"

      - name: Build
        if: steps.changes.outputs.docs_only != 'true' && env.BUILD_CMD != ''
        shell: bash
        run: eval "$BUILD_CMD"

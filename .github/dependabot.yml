# Dependabot — keeps the GitHub Actions the workflows use up to date. Phase 0
# adds the stack's package ecosystem (npm, pip, …) as another entry.
#
# PR titles come out as "ci: bump …", which passes the PR title check
# (docs/ci.md). Grouped and monthly: one PR to merge a month, not one per
# action a week. Security fixes don't wait for it — Dependabot alerts cover
# those (TEMPLATE.md "GitHub settings").

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
